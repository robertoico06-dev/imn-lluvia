# Alternativa gratuita, sin Claude Code: coloca este archivo dentro de
# .github/workflows/ en tu repositorio para que GitHub ejecute la captura
# automáticamente, dos veces al día, sin depender de ninguna computadora
# encendida ni de un plan de pago de Claude.

name: Captura IMN Sarapiquí

on:
  schedule:
    # Costa Rica no tiene horario de verano: UTC-6 todo el año.
    - cron: '0 14 * * *'  # 8:00 a. m. hora de Costa Rica
    - cron: '0 22 * * *'  # 4:00 p. m. hora de Costa Rica
  workflow_dispatch: {}   # permite lanzarla manualmente para probar

permissions:
  contents: write

jobs:
  capturar:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Instalar Chromium
        run: sudo apt-get update -qq && sudo apt-get install -y -qq chromium

      - name: Ejecutar captura
        run: |
          chmod +x scripts/capturar-sarapiqui.sh
          scripts/capturar-sarapiqui.sh

      - name: Subir el PDF (o el registro de error) al repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Captura automática Sarapiquí $(TZ='America/Costa_Rica' date +'%Y-%m-%d %H:%M')"
          git push
